<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0a1f12" />
    <meta name="description" content="NutriPulse — AI-Powered Nutrition for Africa. Personalised meal plans for 33+ health conditions." />
    <title>NutriPulse 🌿 — AI Nutrition for Africa</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        width: 100%;
        max-width: 100vw;
        overflow-x: hidden;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      body {
        background: #0a1f12;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        /* Prevent rubber-band bounce from revealing background on iOS */
        overscroll-behavior: none;
      }
      #root {
        width: 100%;
        max-width: 100vw;
        overflow-x: hidden;
      }
      /* Loading screen */
      #loading-screen {
        position: fixed; inset: 0;
        background: linear-gradient(135deg, #0a1f12, #1a5c35);
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        z-index: 9999; transition: opacity 0.4s;
      }
      #loading-screen .logo { font-size: 52px; margin-bottom: 14px; animation: pulse 1.5s ease-in-out infinite; }
      #loading-screen .name { font-family: Georgia, serif; font-size: 26px; font-weight: 900; color: #f8f4ee; letter-spacing: -0.5px; }
      #loading-screen .name span { color: #6dcf9e; }
      #loading-screen .sub { color: #6dcf9e; font-size: 13px; margin-top: 8px; opacity: 0.8; }
      #loading-screen .bar { width: 160px; height: 3px; background: rgba(255,255,255,0.1); border-radius: 2px; margin-top: 28px; overflow: hidden; }
      #loading-screen .bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #2d9e6b, #6dcf9e); border-radius: 2px; animation: load 1.8s ease forwards; }
      @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.08)} }
      @keyframes load { 0%{width:0%} 100%{width:100%} }
    </style>
  </head>
  <body>
    <div id="loading-screen">
      <div class="logo">🌿</div>
      <div class="name">Nutri<span>Pulse</span></div>
      <div class="sub">AI-Powered Nutrition for Africa</div>
      <div class="bar"><div class="bar-fill"></div></div>
    </div>
    <div id="root"></div>
    <script>
      window.addEventListener('load', function() {
        setTimeout(function() {
          var s = document.getElementById('loading-screen');
          if (s) { s.style.opacity = '0'; setTimeout(function(){ s.remove(); }, 400); }
        }, 1600);
      });
    </script>
  </body>
</html>
